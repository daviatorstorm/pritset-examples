name: Validate examples

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.language }} example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Node.js
            runtime: node
            directory: nodejs
            command: |
              npm ci --ignore-scripts
              npm run check
          - language: PHP
            runtime: php
            directory: php
            command: |
              composer install --no-interaction --prefer-dist --no-progress
              composer run check
              composer validate --strict
          - language: Python
            runtime: python
            directory: python
            command: |
              python -m pip install --disable-pip-version-check -r requirements.txt
              python -m compileall -q main.py pritset_client.py webhook.py
          - language: Go
            runtime: go
            directory: go
            command: |
              go mod download
              go vet ./...
              go test ./...
              go build ./...
          - language: .NET
            runtime: dotnet
            directory: dotnetcore
            command: |
              dotnet restore
              dotnet build --configuration Release --no-restore
          - language: Java
            runtime: java
            directory: java
            command: mvn --batch-mode --no-transfer-progress verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Set up PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache Composer packages
        if: matrix.runtime == 'php'
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('php/composer.lock') }}

      - name: Set up Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Set up Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum

      - name: Set up .NET
        if: matrix.runtime == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        if: matrix.runtime == 'dotnet'
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('dotnetcore/*.csproj') }}

      - name: Set up Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Install dependencies and validate
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
